# This is a basic workflow to help you get started with Actions

name: deploy-book

# Only run this when the master branch changes
on:
  push:
    branches:
    - master
    # If your git repository has the Jupyter Book within some-subfolder next to
    # unrelated files, you can make this run only if a file within that specific
    # folder has been modified.
    #
    # paths:
    # - book/**

# This job installs dependencies, build the book, and pushes it to `gh-pages`
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    env:
      # Keep numpy 1.x also for the pip installs run inside the notebooks
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt
    steps:
    - uses: actions/checkout@v2

    # Install dependencies
    - name: Set up Python 3.11
      uses: actions/setup-python@v1
      with:
        python-version: 3.11.14

    - name: Install binaries
      run: |
        sudo apt-get update
        sudo apt-get install libsndfile1
        sudo apt-get install ffmpeg
        sudo apt-get install tar
        sudo apt-get install wget
        python -m pip install --upgrade pip
    - name: Install dependencies
      run: |
        pip install "compiam[torch] @ git+https://github.com/vivekvjyn/compIAM.git"
        pip install -r requirements.txt
        pip install -e .
    - name: Build the book
      run: |
        jupyter-book build webbook/
    # Push the book's HTML to github-pages
    - name: GitHub Pages action
      uses: peaceiris/actions-gh-pages@v3.6.1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./webbook/_build/html